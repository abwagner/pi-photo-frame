services:
  photo-frame:
    build: .
    # Or use pre-built image (if you publish one):
    # image: your-registry/openfotoframe:latest
    container_name: pi-photo-frame
    restart: unless-stopped
    volumes:
      # Persist uploaded photos
      - photo_uploads:/app/uploads
      # Persist settings, users, gallery data
      - photo_data:/app/data
    # Uncomment to enable HDMI-CEC TV power control:
    # devices:
    #   - "/dev/cec0:/dev/cec0"
    # group_add:
    #   - "44"  # video group GID — needed for CEC device access (run: stat -c %g /dev/cec0)
    environment:
      - TZ=America/New_York  # Change to your timezone
      - BACKUP_TIME=03:00    # Daily backup time (HH:MM, 24h format)
      - BEHIND_PROXY=1
      - SECURE_COOKIES=1
      - DISPLAY_SESSION_LIFETIME_SECONDS=${DISPLAY_SESSION_LIFETIME_SECONDS:-2592000}
      # Optional; otherwise a dedicated token is generated in the data volume.
      - CEC_AGENT_TOKEN=${CEC_AGENT_TOKEN:-}
      - ENABLE_HSTS=${ENABLE_HSTS:-0}
      - TRUSTED_HTTPS_HOSTNAME=${TRUSTED_HTTPS_HOSTNAME:-}
      - MAX_IMAGE_PIXELS=${MAX_IMAGE_PIXELS:-80000000}
      - MAX_IMAGE_DIMENSION=${MAX_IMAGE_DIMENSION:-20000}
    # Healthcheck is defined in Dockerfile

    # Resource limits (optional, good for Pi)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M

  caddy:
    build: ./caddy
    container_name: pi-photo-frame-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - path: .env
        required: false
    depends_on:
      - photo-frame

volumes:
  photo_uploads:
    name: photoframe_uploads
  photo_data:
    name: photoframe_data
  caddy_data:
  caddy_config:
