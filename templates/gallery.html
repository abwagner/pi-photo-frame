<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Pi Photo Frame</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
    <script src="{{ url_for('static', filename='js/legacy-events.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>🖼️ Gallery Management</h1>
                <nav class="nav-links">
                    <a href="/upload">📤 Upload</a>
                    <a href="/gallery" class="active">🖼️ Gallery</a>
                    {% if is_admin %}
                    <a href="/admin/users">👥 Users</a>
                    {% endif %}
                    <a href="/display" target="_blank">📺 Display</a>
                    <a href="/change-password">🔑 Password</a>
                    <a href="/logout">🚪 Logout</a>
                </nav>
            </div>

            <div class="stats-bar">
                <div class="stat">
                    <span>Total:</span>
                    <span class="stat-value" id="total-count">0</span>
                </div>
                <div class="stat">
                    <span>Visible:</span>
                    <span class="stat-value" id="enabled-count">0</span>
                </div>
                <div class="stat">
                    <span>Hidden:</span>
                    <span class="stat-value" id="disabled-count">0</span>
                </div>
            </div>
        </header>

        <div id="message" class="message"></div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="select-all-wrapper">
                    <input type="checkbox" id="select-all" title="Select all">
                    <span class="selection-count"><span id="selected-count">0</span> selected</span>
                </div>
                
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All</button>
                    <button class="filter-tab" data-filter="enabled">Visible</button>
                    <button class="filter-tab" data-filter="disabled">Hidden</button>
                </div>
            </div>

            <div class="toolbar-right">
                <button class="btn btn-success" id="bulk-enable" disabled>✓ Show Selected</button>
                <button class="btn btn-warning" id="bulk-disable" disabled>⊘ Hide Selected</button>
                <button class="btn btn-danger" id="bulk-delete" disabled>🗑 Delete Selected</button>
            </div>
        </div>

        <!-- Image Grid -->
        <div class="image-grid" id="image-grid">
            <!-- Images loaded via JS -->
        </div>

        <div class="empty-state" id="empty-state" style="display: none;">
            <h2>No images yet</h2>
            <p>Upload some photos to get started</p>
            <a href="/upload" class="btn btn-primary" style="margin-top: 20px;">Go to Upload</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/gallery.js') }}" defer></script>
</body>
</html>
