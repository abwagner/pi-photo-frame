<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>OpenFotoFrame Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/display.css') }}">
    <script src="{{ url_for('static', filename='js/legacy-events.js') }}" defer></script>
</head>
<body>
    <div class="frame-container">
        <div class="image-wrapper" id="image-wrapper">
            <img id="slide-a" class="snapshot-img active" alt="">
            <img id="slide-b" class="snapshot-img" alt="">
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" data-onclick="previousSlide()">← Prev</button>
        <button class="control-btn" id="pause-btn" data-onclick="togglePause()" aria-label="Pause slideshow">⏸ Pause</button>
        <button class="control-btn" data-onclick="nextSlide()">Next →</button>
        <button class="control-btn" id="fullscreen-btn" data-onclick="toggleFullscreen()">⛶ Full</button>
    </div>
    <script src="{{ url_for('static', filename='js/display.js') }}" defer></script>
</body>
</html>
